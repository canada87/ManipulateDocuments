<!doctype html>
<html lang="en" data-theme="dystopia">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexusMD</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="tools">
        <button id="btn-side" title="Folder &amp; outline (Ctrl+B)">☰</button>
        <button id="btn-open" title="Open (Ctrl+O)">OPEN</button>
        <button id="btn-save" title="Save (Ctrl+S)">SAVE</button>
        <select id="recent" title="Recent files"><option value="">RECENT</option></select>
        <div class="menu-wrap">
          <button id="btn-settings" title="Settings" aria-haspopup="menu">⚙</button>
          <div class="menu" id="settings" role="menu" hidden>
            <div class="label">EXPORT</div>
            <button data-export="html">HTML…</button>
            <button data-export="pdf">PDF (print)…</button>
            <div class="label">THEME</div>
            <button data-set-theme="dystopia">Dystopia</button>
            <button data-set-theme="phosphor">Phosphor</button>
            <button data-set-theme="synthwave">Synthwave</button>
            <div class="label">HELP</div>
            <button id="btn-about">About &amp; shortcuts</button>
          </div>
        </div>
      </div>
    </header>
    <div class="banner" id="banner" hidden></div>
    <div class="work">
      <aside class="side" id="side" hidden>
        <details open><summary>FILES</summary><div class="tree" id="tree"></div></details>
        <details open><summary>OUTLINE</summary><div class="outline" id="outline"></div></details>
      </aside>
      <main class="panes" id="panes"><div class="drop" id="drop" hidden></div></main>
    </div>
    <footer class="status">
      <span class="chip" id="st-state"></span>
      <span class="path" id="st-path"></span>
      <span class="spacer"></span>
      <span id="st-pos"></span>
      <button class="fmt" id="st-fmt" title="Encoding: click to reopen or save with another one"></button>
      <button class="ver" id="st-ver" title="About"></button>
    </footer>
    <div class="modal" id="modal" hidden><div class="box" id="modal-box"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
